name: smoke
permissions:
  contents: read
on:
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.html'
      - '**.css'
      - '**.toml'
      - '**about.nim'
      - '.github/workflows/build.yml'
    branches:
      - master
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.html'
      - '**.css'
      - '**.toml'
      - '**about.nim'
      - '.github/workflows/build.yml'
    branches:
      - master
jobs:
  main:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-latest
          - os: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Homebrew
        if: runner.os != 'macOS'
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
      - name: Install packages
        run: |
          brew update && brew install nim
      - name: Setup
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            sudo apt-get install -y build-essential pkg-config nasm git
          elif [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]; then
            sudo apt-get install -y build-essential pkg-config git
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV
          fi
          echo "DISABLE_VPX=1" >> $GITHUB_ENV
          echo "DISABLE_SVTAV1=1" >> $GITHUB_ENV
          echo "DISABLE_HEVC=1" >> $GITHUB_ENV
      - name: Build FFmpeg
        run: nimble makeff
      - name: Compile
        run: nimble make
      - name: Test
        run: nimble test
      - name: e2e Test
        run: python3 -m pip install av && python3 tests/test.py
      - name: Benchmark
        run: nimble bench
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: tests/benchmark_results.json
          if-no-files-found: warn

  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "stable"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 mingw-w64-tools mingw-w64-x86-64-dev
          sudo apt-get install -y build-essential pkg-config nasm git meson
          echo "DISABLE_VPX=1" >> $GITHUB_ENV
          echo "DISABLE_SVTAV1=1" >> $GITHUB_ENV
          echo "DISABLE_HEVC=1" >> $GITHUB_ENV
      - name: Build FFmpeg
        run: nimble makeffwin
      - name: Compile
        run: nimble windows

  windows-native:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "stable"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      
      - name: Install dependencies (Git Bash)
        shell: bash
        run: |
          # Install meson and ninja via pip (required for dav1d)
          python -m pip install --upgrade pip
          python -m pip install meson ninja
          
          # Set environment variables for fast build
          echo "DISABLE_VPX=1" >> $GITHUB_ENV
          echo "DISABLE_SVTAV1=1" >> $GITHUB_ENV
          echo "DISABLE_HEVC=1" >> $GITHUB_ENV
          echo "DISABLE_WHISPER=1" >> $GITHUB_ENV
      
      - name: Build FFmpeg (Git Bash)
        shell: bash
        run: nimble makeff
      
      - name: Compile honeyclip
        shell: bash
        run: nimble make
      
      - name: Test (verify ML stubs don't crash)
        shell: bash
        run: |
          nimble test
          
          # Test that ML-dependent commands gracefully degrade
          echo "Testing engage command (should warn about ML unavailable)..."
          ./honeyclip.exe --help | grep -i engage || echo "No engage subcommand found (expected)"
          
          echo "Testing reframe command (should warn about ML unavailable)..."  
          ./honeyclip.exe --help | grep -i reframe || echo "No reframe subcommand found (expected)"
      
      - name: E2E Test
        shell: bash
        run: |
          python -m pip install av
          python tests/test.py
      
      - name: Benchmark
        shell: bash
        run: nimble bench
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-windows-native
          path: tests/benchmark_results.json
          if-no-files-found: warn

