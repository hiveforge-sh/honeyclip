# Nim configuration for honeyclip

# Include paths (relative to project root)
--passC:"-I./build/include"
--passC:"-I./build/include/facedetection"
--passC:"-I./build/include/onnxruntime"

# Library path (relative to project root)
--passL:"-L./build/lib"

# Core FFmpeg libraries
--passL:"-lavfilter -lavformat -lavcodec -lswresample -lswscale -lavutil"

# Codec libraries
--passL:"-lmp3lame -lopus -lx264 -ldav1d"
@if enable_vpx:
  --passL:"-lvpx"
@end
@if enable_svtav1:
  --passL:"-lSvtAv1Enc"
@end
@if enable_hevc:
  --passL:"-lx265"
@end

@if macosx:
  --passL:"-framework VideoToolbox -framework AudioToolbox"
  --passL:"-framework CoreFoundation -framework CoreMedia -framework CoreVideo"
@end

@if linux:
  @if arm64:
    --passL:"-L./build/lib/aarch64-linux-gnu"
  @else:
    --passL:"-L./build/lib/x86_64-linux-gnu"
  @end
  --passL:"-L./build/lib64"
@end

@if windows:
  # Windows system libraries for FFmpeg
  --passL:"-lole32 -lbcrypt -lws2_32 -lsecur32 -lstrmiids -luuid"
@end

# ML libraries - skip on Windows due to LTO build issues
# TODO: Rebuild ML libs without LTO for Windows support
@if not windows:
  @if enable_ml:
    --passL:"-lfacedetection"
    # ONNX Runtime components (must be linked in dependency order)
    --passL:"-lonnxruntime_session"
    --passL:"-lonnxruntime_optimizer"
    --passL:"-lonnxruntime_providers"
    --passL:"-lonnxruntime_framework"
    --passL:"-lonnxruntime_graph"
    --passL:"-lonnxruntime_util"
    --passL:"-lonnxruntime_common"
    --passL:"-lonnxruntime_mlas"
    --passL:"-lonnxruntime_flatbuffers"
    --passL:"-lonnxruntime_lora"
    # ONNX Runtime dependencies
    --passL:"-lonnx -lonnx_proto"
    --passL:"-lnsync_cpp"
    --passL:"-lprotobuf-lite"
    --passL:"-lre2"
    --passL:"-lcpuinfo -lclog"
    # Abseil libraries (required by ONNX Runtime and RE2)
    --passL:"-labsl_hash -labsl_city -labsl_low_level_hash"
    --passL:"-labsl_raw_hash_set -labsl_hashtablez_sampler"
    --passL:"-labsl_strings -labsl_strings_internal -labsl_string_view"
    --passL:"-labsl_str_format_internal"
    --passL:"-labsl_throw_delegate -labsl_int128"
    --passL:"-labsl_synchronization -labsl_graphcycles_internal -labsl_kernel_timeout_internal"
    --passL:"-labsl_time -labsl_time_zone -labsl_civil_time"
    --passL:"-labsl_base -labsl_spinlock_wait -labsl_malloc_internal"
    --passL:"-labsl_raw_logging_internal -labsl_log_severity"
    --passL:"-labsl_log_internal_message -labsl_log_internal_check_op -labsl_log_internal_conditions"
    --passL:"-labsl_log_internal_format -labsl_log_internal_globals -labsl_log_internal_log_sink_set"
    --passL:"-labsl_log_internal_nullguard -labsl_log_internal_fnmatch -labsl_log_internal_proto"
    --passL:"-labsl_log_globals -labsl_log_entry -labsl_log_sink -labsl_examine_stack -labsl_vlog_config_internal"
    --passL:"-labsl_strerror"
    --passL:"-labsl_stacktrace -labsl_symbolize -labsl_debugging_internal"
    --passL:"-labsl_demangle_internal -labsl_demangle_rust -labsl_decode_rust_punycode -labsl_utf8_for_code_point"
  @end
@end

@if enable_whisper:
  --passL:"-lwhisper"
  --passL:"-lggml-base"
  --passL:"-lggml"
  --passL:"-lggml-cpu"
  @if macosx:
    --passL:"-lggml-blas"
    @if arm64:
      --passL:"-lggml-metal"
    @end
    --passL:"-framework Accelerate"
    --passL:"-framework Metal -framework MetalKit -framework Foundation"
  @else:
    --passL:"-lgomp"
    @if enable_cuda:
      --passL:"-L/usr/local/cuda-12.8/lib64/stubs"
      --passL:"-L/usr/local/cuda-12.8/lib64"
      --passL:"-lggml-cuda -lcuda -lcudart -lcublas -lcublasLt"
    @end
  @end
@end

@if enable_hevc or enable_whisper:
  # C++ standard library
  @if macosx:
    --passL:"-lc++"
  @else:
    --passL:"-lstdc++"
  @end
@end

# Fix for GCC
--passC:"-Wno-incompatible-pointer-types"
